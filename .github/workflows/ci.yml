# SPDX-License-Identifier: AGPL-3.0-only
# CI per .kiro/specs/duocode/test-strategy.md section 12.
# Spec jobs run now. Each backend job runs once the files it needs exist (task 2.3), so CI never reports a pass for a job with nothing to check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect which parts exist
    runs-on: ubuntu-latest
    outputs:
      backend_src: ${{ steps.d.outputs.backend_src }}
      backend_tests: ${{ steps.d.outputs.backend_tests }}
      deno_lock: ${{ steps.d.outputs.deno_lock }}
      simulator: ${{ steps.d.outputs.simulator }}
      dockerfile: ${{ steps.d.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          has() { [ -n "$(git ls-files -- "$@")" ]; }
          # check: backend/deno.json and at least one TypeScript file under backend/src
          echo "backend_src=$([ -f backend/deno.json ] && has 'backend/src/*.ts' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # test: at least one module that deno test collects (*_test.ts, *.test.ts, test.ts)
          echo "backend_tests=$([ -f backend/deno.json ] && has 'backend/tests/*_test.ts' 'backend/tests/*.test.ts' 'backend/tests/test.ts' 'backend/tests/*/test.ts' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # lockfile: integrity is checked as soon as backend/deno.lock exists
          echo "deno_lock=$([ -f backend/deno.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # simulate: the simulator entry point and the CI Compose file it starts
          echo "simulator=$([ -f tools/simulator/deno.json ] && [ -f tools/simulator/main.ts ] && [ -f deployment/docker-compose.ci.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$([ -f backend/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets or key material committed
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..*)?|secrets/.*|.*\.pem|.*\.key)$' | grep -vE '(^|/)\.env\.example$|(^|/)secrets\.example/'; then
            echo "Secret-like files are tracked"; exit 1
          fi
      - name: No compiled binaries committed
        run: |
          if git ls-files | grep -E '\.(exe|dll|so|dylib|o|a|class|jar|wasm)$'; then
            echo "Binary artefacts are tracked"; exit 1
          fi
      - name: SPDX headers on source files
        run: python3 .kiro/specs/duocode/spdx-headers.py
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.3
      - name: Specification consistency checks (TS-DOC)
        run: python3 .kiro/specs/duocode/check-consistency.py
  check:
    name: Format, lint, type check
    runs-on: ubuntu-latest
    needs: [detect]
    if: ${{ needs.detect.outputs.backend_src == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt --check
      - run: deno task lint
      - run: deno task check
      - name: Architecture rules (engine boundary, Math.random, credential access)
        run: deno task lint:rules
      - name: Migrations are immutable
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A merged migration is never edited, renamed or deleted; new files only (test-strategy.md TS-DB).
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-status --no-renames FETCH_HEAD HEAD -- migrations/ | grep -v '\.gitkeep$' | grep -v '^A' || true)
          if [ -n "$changed" ]; then echo "Merged migrations changed:"; echo "$changed"; exit 1; fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [detect]
    if: ${{ needs.detect.outputs.backend_tests == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duocode
          POSTGRES_PASSWORD: duocode_ci
          POSTGRES_DB: duocode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duocode" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://duocode:duocode_ci@localhost:5432/duocode_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Throwaway secrets for the test run
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          head -c 32 /dev/urandom > "$RUNNER_TEMP/secrets/ratelimit_hmac_key"
          echo "RATE_LIMIT_HMAC_KEY_FILE=$RUNNER_TEMP/secrets/ratelimit_hmac_key" >> "$GITHUB_ENV"
          echo "CODE_KEYRING_FILE=$RUNNER_TEMP/secrets/code_keyring" >> "$GITHUB_ENV"
      - name: Apply migrations
        if: ${{ hashFiles('backend/src/tasks/migrate.ts') != '' }}
        run: deno task migrate
      - name: Generate the test key ring with the key tooling
        # Runs once task 4.6 delivers keys:generate, so the ring has the real format (task 1.8 B2).
        if: ${{ hashFiles('backend/src/tasks/keys_generate.ts') != '' }}
        run: deno task keys:generate
      - run: deno task test --coverage=coverage

  simulate:
    name: Simulation
    runs-on: ubuntu-latest
    needs: [detect, test]
    if: ${{ needs.detect.outputs.simulator == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run 200 games against the built stack
        run: |
          docker compose -f deployment/docker-compose.ci.yml up -d --build --wait
          cd tools/simulator
          deno task simulate --games 200 --seed 12345 --concurrency 10 \
            --strategy mixed --retry-rate 0.1 --rotate-rate 0.02 --lost-rotation-rate 0.5 \
            --test-deployment --base-url http://localhost:8080/api/v1

  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    needs: [detect]
    if: ${{ needs.detect.outputs.deno_lock == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno.lock matches deno.json and the registries
        run: deno install --frozen
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [detect]
    if: ${{ needs.detect.outputs.dockerfile == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t duocode-backend:ci .
