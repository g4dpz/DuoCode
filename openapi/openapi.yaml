openapi: 3.1.0
info:
  title: DuoCode API
  version: 1.0.0-draft.5
  summary: Two-player asynchronous code-breaking game.
  description: |
    Draft contract for the DuoCode backend MVP. Requirements: `.kiro/specs/duocode/requirements.md`.
    Behavioural rules: `.kiro/specs/duocode/state-machine.md`. Storage: `database-schema.md`.

    **Credentials.** There are three separate bearer-style credentials:
    game access tokens (`dca_…`), invitation tokens (`dci_…`) and rematch capabilities (`dcr_…`).
    Each is accepted only where its type is expected. Tokens are shown once, in the response that issues them.

    **Lost tokens cannot be recovered.** DuoCode has no accounts and no verified identity.
    This includes the replacement token of a rotation if its response is lost and the replay window has passed.
    Whoever holds a token is the player. If a token is lost, nobody, including the server operator,
    can restore access to that player's seat. Rotation (`rotateAccessToken`) needs the current token and
    is meant for a suspected leak, not for recovery.

    **Secret codes** are never returned before the game is `COMPLETED`. Responses and error messages never
    echo submitted codes, guesses or tokens.

    **Idempotency.** `submitGuess` and `rotateAccessToken` require an `Idempotency-Key`. `submitGuess` accepts any UUID.
    `rotateAccessToken` requires a version 4 (random) UUID from a cryptographically secure random source, because for
    rotation the key is also a replay secret. See those operations.
    Request fingerprints are computed from the RFC 8785 canonical form of the request, so key order and whitespace
    in a body do not matter.

    **Expired and deleted games.** A valid credential of a game that is past its retention end but not yet deleted
    receives `410 GAME_EXPIRED`. After deletion nothing remains and every credential receives `401 INVALID_CREDENTIALS`
    (joining with an invitation of a deleted game receives `404 INVALID_INVITATION`).
    A game is expired when the server time is greater than or equal to its retention end.

    **Display safety.** Nicknames are returned only as JSON strings with `Content-Type: application/json; charset=utf-8`
    and `X-Content-Type-Options: nosniff`, never as HTML. Clients must escape them for their display context and show
    them in an isolated bidirectional context (for example an HTML `<bdi>` element), so that mixed-direction names
    cannot reorder neighbouring text.

    **Nicknames** are trimmed, must be 1 to 24 Unicode code points after trimming, and must not contain control characters
    or bidirectional embedding, override or isolate controls.
    The trimmed value is stored and returned unchanged. Duplicates are allowed.

    **Rate limits.** Per-IP and per-player limits are shared across all server instances. Every endpoint can return
    `429 RATE_LIMITED` with `Retry-After`.
    If the shared rate-limit store is unavailable the server fails closed with `503`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://{host}/api/v1
    description: Public listener behind the reverse proxy. Replace the host with your deployment.
    variables:
      host:
        default: localhost
        description: Host name of the deployment.
tags:
  - name: Games
    description: Creating and joining games.
  - name: Play
    description: Secret codes, guesses, progress and results.
  - name: Credentials
    description: Rotation of the game access token.
  - name: Rematch
    description: Rematch capability and rematch creation. One rematch ever per original game.
  - name: Operations
    description: Health, metrics and cleanup. Metrics and cleanup are served only on the internal admin listener.
paths:
  /games:
    post:
      tags: [Games]
      operationId: createGame
      summary: Create a game
      description: Creates a game and seat 1. Returns the first player's access token and the invitation token once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameRequest' }
      responses:
        '201':
          description: Game created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateGameResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /games/{gameId}/join:
    post:
      tags: [Games]
      operationId: joinGame
      summary: Join a game with an invitation
      description: |
        Consumes the invitation token and creates seat 2. An unknown game id and an invalid invitation
        token return the same `404 INVALID_INVITATION` response.
      security: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinGameRequest' }
      responses:
        '201':
          description: Joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinGameResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: Unknown or deleted game, or invalid invitation (same response for all).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: { code: INVALID_INVITATION, message: Invitation is not valid., requestId: 4f0c2c9e } }
        '409': { $ref: '#/components/responses/GameFull' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}/secret-code:
    put:
      tags: [Play]
      operationId: submitSecretCode
      summary: Set the caller's secret code
      description: |
        Sets the caller's secret code once. The response never contains the code. The game becomes `ACTIVE`
        when both players have joined and both codes are set.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitSecretCodeRequest' }
      responses:
        '200':
          description: Code stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitSecretCodeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409':
          description: A code is already set for this player (`CODE_ALREADY_SET`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '422':
          description: Game is completed (`GAME_COMPLETED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}:
    get:
      tags: [Play]
      operationId: getGameStatus
      summary: Get game status
      description: |
        Returns the game state, both nicknames and the opponent's progress summary: guesses used, solved flag,
        exhausted flag. The opponent's individual guesses and feedback are never returned here.
        Reads do not extend the retention period.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatus' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}/guesses:
    post:
      tags: [Play]
      operationId: submitGuess
      summary: Submit a guess against the opponent's code
      description: |
        Requires header `Idempotency-Key`: a UUID in canonical text form (8-4-4-4-12 hexadecimal digits,
        any version, case-insensitive). The client chooses a new key for each new guess and reuses the same key
        and the same body when retrying.

        **Scope.** A key is unique per player (and so per game). The same value used by the other player or in another
        game is unrelated.

        **Duplicates.** The server looks the key up inside the guess transaction. If the key was used before with
        the same body, the server returns the original status and body exactly as first produced, adds header
        `Idempotent-Replay: true`, and changes nothing. A replay is answered before game-state and attempt checks,
        so a retry of the guess that completed the game still returns the original response.
        If the key was used with a different body, the server returns `409 IDEMPOTENCY_CONFLICT` and changes nothing.

        **What is stored.** Only successful guesses store a key and response. A rejected request stores nothing,
        so its key can be reused for a corrected request. Keys are kept until the game is deleted.

        A guess never consumes more than one attempt per distinct key. A different key with the same guess
        is a new guess and consumes an attempt.

        The replayed body keeps the `gameState` and `guessesRemaining` values it had when first produced.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitGuessRequest' }
      responses:
        '201':
          description: Guess recorded, or replayed original response.
          headers:
            Idempotent-Replay:
              description: Present with value `true` when this response is a replay of an earlier request.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitGuessResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409':
          description: The idempotency key was used with a different request body (`IDEMPOTENCY_CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '422':
          description: |
            Rule violation: `GAME_NOT_ACTIVE`, `GAME_COMPLETED`, `ATTEMPTS_EXHAUSTED` or `ALREADY_SOLVED`.
            No state is changed and no attempt is consumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}/progress:
    get:
      tags: [Play]
      operationId: getProgress
      summary: Get the caller's own guesses and counts
      description: |
        Returns only the caller's own guesses with their feedback. This and `getResults` are the only operations that
        return decrypted guesses. The opponent's guesses and feedback are never returned here.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The caller's progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}/results:
    get:
      tags: [Play]
      operationId: getResults
      summary: Get final results
      description: |
        Available only when the game is `COMPLETED`. Reveals both secret codes, all guesses and the outcome.
        The server verifies that the game is completed before it reads any stored code or guess. Before completion the
        response is `422 GAME_NOT_COMPLETED` and no code or guess is read, decrypted or revealed.
        Results are readable with the player's **current** access token, including after any number of rotations.
        A token revoked by rotation cannot read results.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Results' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '422':
          description: Game is not completed (`GAME_NOT_COMPLETED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /games/{gameId}/access-token/rotate:
    post:
      tags: [Credentials]
      operationId: rotateAccessToken
      summary: Replace the caller's access token (idempotent)
      description: |
        Requires `Idempotency-Key`, which must be a version 4 UUID generated from a cryptographically secure random source
        (for example `crypto.randomUUID()`). Other UUID versions are rejected with `INVALID_IDEMPOTENCY_KEY`.
        In one transaction the server creates a new access token for the caller, revokes the presented token and
        revokes the caller's unused rematch capability. After the commit the old token authorises nothing, with the
        single exception below.

        **Lost response.** If the response is lost, repeat the same request with the **old** token and the **same key**
        within the replay window (10 minutes by default). The server returns the original response, the same new token,
        with header `Idempotent-Replay: true`. A replay changes nothing: it does not restore, reactivate or un-revoke the old
        token, which stays revoked for every other operation. After the window, or with a different key, the old token
        receives `401 INVALID_CREDENTIALS`.

        The replay is honoured only when all of these hold: the original, now revoked, token is presented; the original
        key is presented; the request fingerprint matches; the window is still valid; and the replacement token has not
        been revoked. Otherwise the response is `401` or `409` and nothing is decrypted. The replacement token never
        appears in an error response, a log or a metric.

        **If the replacement token is lost after the window has passed, the seat is lost.** Nobody, including the operator,
        can recover it. Store the old token and the key before sending, and store the new token as soon as it arrives.
        Using the new token with the same key returns `409 IDEMPOTENCY_CONFLICT`.

        This is deliberate rotation and a bounded retry, not recovery: it needs the current token or the old token and the key.
        Rotation does not extend the retention period of a completed game. Results remain readable with the new token.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RotationIdempotencyKey'
      responses:
        '201':
          description: New token issued once, or replay of the original response.
          headers:
            Idempotent-Replay:
              description: Present with value `true` when this response replays an earlier rotation.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateAccessTokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409':
          description: The idempotency key was used for a different rotation (`IDEMPOTENCY_CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /games/{gameId}/rematch-capability:
    post:
      tags: [Rematch]
      operationId: mintRematchCapability
      summary: Mint a rematch capability for a completed game
      description: |
        Creates a rematch capability for the caller and revokes the caller's previous unused capability
        for this game. Rotating the caller's access token revokes an unused capability, so mint a new one afterwards.
        If a rematch has ever been created for this game, even one that has since expired or been deleted,
        the response is `409 REMATCH_ALREADY_CREATED`. The capability authorises only `createRematch` and grants no read or play access.
      security: [{ accessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '201':
          description: Capability issued once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintRematchCapabilityResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409':
          description: A rematch has already been created for this game at some time (`REMATCH_ALREADY_CREATED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '422':
          description: Game is not completed (`GAME_NOT_COMPLETED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rematches:
    post:
      tags: [Rematch]
      operationId: createRematch
      summary: Create a rematch with a rematch capability
      description: |
        In one transaction, consumes the capability and creates a new game with entirely new credentials:
        a new access token for the requester (seat 1) and a new invitation token.
        Tokens of the original game do not work on the new game and the reverse.
        At most one rematch is ever created per original game, even if that rematch later expires or is deleted.
        On success, every unused rematch capability of the original game is revoked in the same transaction, so a
        second player presenting one afterwards receives `401 INVALID_CREDENTIALS`. Check `rematchCreated` on the status
        of the original game. The requester shares `gameId` and `invitationToken`
        with the opponent outside the API. The server never re-issues them.
      security: [{ rematchCapability: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRematchRequest' }
      responses:
        '201':
          description: Rematch game created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateGameResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409':
          description: A rematch has already been created for the original game at some time (`REMATCH_ALREADY_CREATED`). A defensive backstop. Normally every capability was revoked when the rematch was created, and the response is `401`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410': { $ref: '#/components/responses/GameExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness and readiness
      security: []
      responses:
        '200':
          description: Process, database and key ring are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [unavailable] }
  /admin/metrics:
    servers:
      - url: http://admin.internal:8081
        description: Admin listener. Internal network only. Not routed by the public proxy.
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Served only on the admin listener and protected by the admin token. Aggregate counts, gauges and
        histograms only. Labels come from bounded sets and never contain game ids, player ids, nicknames,
        IP addresses or tokens.
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /admin/cleanup:
    servers:
      - url: http://admin.internal:8081
        description: Admin listener. Internal network only. Not routed by the public proxy.
    post:
      tags: [Operations]
      operationId: runCleanup
      summary: Delete games past their retention end
      description: |
        Runs the same bounded, repeatable cleanup as `deno task cleanup`, which the `cleanup` service runs hourly.
        Intended for manual and dry runs. Safe to call repeatedly and concurrently. Deletes games with
        server time greater than or equal to their retention end, together with all attached data.
      security: [{ adminToken: [] }]
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Cleanup result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupResult' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: Game access token (`dca_` prefix). Authorises one player in one game.
    rematchCapability:
      type: http
      scheme: bearer
      description: Rematch capability (`dcr_` prefix). Authorises creating one rematch only.
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Administrative credential, separate from all player credentials.
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID of any version in canonical text form, case-insensitive. Unique per player and operation. See `submitGuess`. Version 4 recommended.
      schema: { type: string, format: uuid }
    RotationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Version 4 UUID in canonical text form, case-insensitive, from a cryptographically secure random source.
        For rotation it doubles as the replay secret. Unique per player and operation. Other versions are rejected.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
  responses:
    ValidationError:
      description: Request failed validation. Nothing was changed. The message never echoes request values.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: INVALID_GUESS, message: Guess must contain 4 symbols from 1 to 6., requestId: 7a1d9be0 } }
    InvalidCredentials:
      description: Missing, unknown, revoked, consumed, wrong-type or deleted credential. All cases look the same.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: INVALID_CREDENTIALS, message: Credentials are not valid., requestId: 1b2c3d4e } }
    GameExpired:
      description: |
        The credential (or invitation) is valid but its game is at or past its retention end and not yet deleted.
        After deletion the response is 401 (404 for invitations).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GameFull:
      description: Seat 2 is taken or the invitation is consumed (`GAME_FULL`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Temporarily unavailable, for example the shared rate-limit store or a lock timed out. Retry later.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Nickname:
      type: string
      minLength: 1
      maxLength: 24
      pattern: '^[^\u0000-\u001F\u007F-\u009F\u202A-\u202E\u2066-\u2069]+$'
      description: |
        Display label. The server trims leading and trailing white space first, then requires 1 to 24 Unicode code points
        and no control characters (category Cc) and none of U+202A to U+202E and U+2066 to U+2069 (bidirectional
        embedding, override and isolate controls). Malformed Unicode is rejected. Other Unicode, including directional
        marks, joiners and emoji sequences, is accepted. The trimmed value is stored and returned
        unchanged. Duplicates are allowed. Violations return `INVALID_NICKNAME`.
    Symbol:
      type: integer
      minimum: 1
      maximum: 6
    Code:
      type: array
      items: { $ref: '#/components/schemas/Symbol' }
      minItems: 4
      maxItems: 4
    GameState:
      type: string
      enum: [WAITING_FOR_PLAYER, WAITING_FOR_CODES, ACTIVE, COMPLETED]
    Feedback:
      type: object
      required: [exact, misplaced]
      additionalProperties: false
      properties:
        exact: { type: integer, minimum: 0, maximum: 4 }
        misplaced: { type: integer, minimum: 0, maximum: 4 }
    CreateGameRequest:
      type: object
      required: [nickname]
      additionalProperties: false
      properties:
        nickname: { $ref: '#/components/schemas/Nickname' }
    CreateGameResponse:
      type: object
      required: [gameId, seat, state, accessToken, invitationToken, expiresAt]
      properties:
        gameId: { type: string, format: uuid }
        seat: { type: integer, enum: [1] }
        state: { $ref: '#/components/schemas/GameState' }
        accessToken: { type: string, description: Game access token. Shown once. Not recoverable. }
        invitationToken: { type: string, description: Invitation token. Shown once. Not recoverable. }
        expiresAt: { type: string, format: date-time }
        rematchOf: { type: [string, 'null'], format: uuid, description: Present only for rematches. }
    JoinGameRequest:
      type: object
      required: [invitationToken, nickname]
      additionalProperties: false
      properties:
        invitationToken: { type: string }
        nickname: { $ref: '#/components/schemas/Nickname' }
    JoinGameResponse:
      type: object
      required: [gameId, seat, state, accessToken, expiresAt]
      properties:
        gameId: { type: string, format: uuid }
        seat: { type: integer, enum: [2] }
        state: { $ref: '#/components/schemas/GameState' }
        accessToken: { type: string, description: Game access token. Shown once. Not recoverable. }
        expiresAt: { type: string, format: date-time }
    SubmitSecretCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/Code' }
    SubmitSecretCodeResponse:
      type: object
      description: The submitted code is deliberately not returned.
      required: [state, codeSet]
      properties:
        state: { $ref: '#/components/schemas/GameState' }
        codeSet: { type: boolean, enum: [true] }
    SubmitGuessRequest:
      type: object
      required: [guess]
      additionalProperties: false
      properties:
        guess: { $ref: '#/components/schemas/Code' }
    SubmitGuessResponse:
      type: object
      required: [guessNumber, feedback, solved, guessesUsed, guessesRemaining, gameState]
      properties:
        guessNumber: { type: integer, minimum: 1, maximum: 10 }
        feedback: { $ref: '#/components/schemas/Feedback' }
        solved: { type: boolean }
        guessesUsed: { type: integer, minimum: 1, maximum: 10 }
        guessesRemaining: { type: integer, minimum: 0, maximum: 9 }
        gameState: { $ref: '#/components/schemas/GameState' }
    PlayerSummary:
      type: object
      required: [seat, nickname, codeSet]
      properties:
        seat: { type: integer, enum: [1, 2] }
        nickname: { $ref: '#/components/schemas/Nickname' }
        codeSet: { type: boolean }
    OpponentProgress:
      type: object
      description: The only information about the opponent's challenge available before completion.
      required: [guessesUsed, solved, exhausted]
      properties:
        guessesUsed: { type: integer, minimum: 0, maximum: 10 }
        solved: { type: boolean }
        exhausted: { type: boolean }
    GameStatus:
      type: object
      required: [gameId, state, you, players, opponent, rematchCreated, expiresAt]
      properties:
        gameId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/GameState' }
        you: { type: integer, enum: [1, 2], description: The caller's seat. }
        players:
          type: array
          items: { $ref: '#/components/schemas/PlayerSummary' }
          minItems: 1
          maxItems: 2
        opponent:
          oneOf:
            - $ref: '#/components/schemas/OpponentProgress'
            - type: 'null'
          description: Null until the opponent has joined.
        rematchCreated: { type: boolean, description: "True once a rematch has ever been created for this game, even if it has since expired or been deleted. Never reveals its id or credentials." }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    GuessRecord:
      type: object
      required: [guessNumber, guess, feedback]
      properties:
        guessNumber: { type: integer, minimum: 1, maximum: 10 }
        guess: { $ref: '#/components/schemas/Code' }
        feedback: { $ref: '#/components/schemas/Feedback' }
    Progress:
      type: object
      required: [guesses, guessesUsed, guessesRemaining, solved, exhausted]
      properties:
        guesses:
          type: array
          items: { $ref: '#/components/schemas/GuessRecord' }
          maxItems: 10
        guessesUsed: { type: integer, minimum: 0, maximum: 10 }
        guessesRemaining: { type: integer, minimum: 0, maximum: 10 }
        solved: { type: boolean }
        exhausted: { type: boolean }
    ResultPlayer:
      type: object
      required: [seat, nickname, solved, guessesUsed, secretCode, guesses]
      properties:
        seat: { type: integer, enum: [1, 2] }
        nickname: { $ref: '#/components/schemas/Nickname' }
        solved: { type: boolean }
        guessesUsed: { type: integer, minimum: 0, maximum: 10 }
        secretCode: { $ref: '#/components/schemas/Code' }
        guesses:
          type: array
          description: Guesses this player made against the opponent's code.
          items: { $ref: '#/components/schemas/GuessRecord' }
    Results:
      type: object
      required: [gameId, outcome, completedAt, players]
      properties:
        gameId: { type: string, format: uuid }
        outcome: { type: string, enum: [PLAYER_1_WINS, PLAYER_2_WINS, DRAW] }
        completedAt: { type: string, format: date-time }
        players:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ResultPlayer' }
    RotateAccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string, description: New access token. Shown once. The previous token is revoked. }
    MintRematchCapabilityResponse:
      type: object
      required: [rematchCapability]
      properties:
        rematchCapability: { type: string, description: Rematch capability. Shown once. Replaces any earlier unused capability. }
    CreateRematchRequest:
      type: object
      required: [nickname]
      additionalProperties: false
      properties:
        nickname: { $ref: '#/components/schemas/Nickname' }
    CleanupResult:
      type: object
      required: [dryRun, gamesDeleted, batches, durationMs]
      properties:
        dryRun: { type: boolean }
        gamesDeleted: { type: integer, minimum: 0, description: "With dryRun, the number that would be deleted." }
        batches: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
    ErrorCode:
      type: string
      description: Stable machine-readable code. Statuses are listed per operation.
      enum:
        - INVALID_GAME_ID
        - INVALID_INVITATION
        - INVALID_CREDENTIALS
        - INVALID_NICKNAME
        - INVALID_CODE
        - INVALID_GUESS
        - INVALID_IDEMPOTENCY_KEY
        - INVALID_REQUEST
        - ATTEMPTS_EXHAUSTED
        - ALREADY_SOLVED
        - CODE_ALREADY_SET
        - GAME_NOT_ACTIVE
        - GAME_NOT_COMPLETED
        - GAME_COMPLETED
        - GAME_FULL
        - GAME_EXPIRED
        - IDEMPOTENCY_CONFLICT
        - REMATCH_ALREADY_CREATED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Human-readable. Never contains request values, codes, guesses or tokens.
            requestId: { type: string }
